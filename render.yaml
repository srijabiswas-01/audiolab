services:
  - type: web
    name: audiolab-youtube-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    healthCheckPath: /health
    envVars:
      - key: YOUTUBE_WORKER_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: YOUTUBE_COOKIES_FILE
        value: /etc/secrets/youtube-cookies.txt
      - key: MAX_CONCURRENT_IMPORTS
        value: "2"
      - key: IMPORTS_PER_MINUTE
        value: "10"
